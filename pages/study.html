<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFF7E8">
  <title>Estudando - StudyBuddy</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/upgrade.css">
</head>
<body class="study-page">
  <nav>
    <a href="../index.html" class="nav-brand"><span class="brand-mark">✦</span> StudyBuddy</a>
    <div class="nav-links">
      <a href="decks.html">Sair do estudo</a>
    </div>
  </nav>

  <main class="study-main">
    <header class="study-header">
      <div>
        <span class="section-kicker">sessão de estudo</span>
        <h2 id="deckTitle">Carregando...</h2>
      </div>
      <div class="study-progress-wrap">
        <span class="progress" id="progressCount">0 / 0</span>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </div>
    </header>

    <section class="study-stage">
      <button class="study-arrow study-arrow-left" id="btnPrev" aria-label="Card anterior">←</button>

      <div class="flashcard-container" id="cardContainer" tabindex="0" role="button" aria-label="Flashcard. Clique para virar.">
        <div class="flashcard" id="flashcard">
          <div class="flashcard-face flashcard-front" id="cardFront">
            <span class="face-label">frente</span>
            <div class="card-content"></div>
            <div class="card-image-wrap" id="frontImage"></div>
            <span class="flip-hint">clique para virar ✦</span>
          </div>
          <div class="flashcard-face flashcard-back" id="cardBack">
            <span class="face-label">verso</span>
            <div class="card-content"></div>
            <div class="card-image-wrap" id="backImage"></div>
            <span class="flip-hint">clique para voltar ↻</span>
          </div>
        </div>
      </div>

      <button class="study-arrow study-arrow-right" id="btnNext" aria-label="Próximo card">→</button>
    </section>

    <div class="study-toolbar">
      <button class="btn btn-secondary" id="btnShuffle">🔀 <span>Embaralhar</span></button>
      <button class="btn btn-primary" id="btnFlip">Virar <kbd>Espaço</kbd></button>
    </div>

    <p class="keyboard-hint">← → para navegar &nbsp; • &nbsp; Espaço para virar</p>
  </main>

  <script src="../js/storage/storage.js"></script>
  <script src="../js/ui/toast.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const deckId = new URLSearchParams(window.location.search).get('id');
      const deck = StorageAPI.getDeck(deckId);

      if (!deck || !deck.cards?.length) {
        Toast.show('Baralho não encontrado ou vazio.', 'error');
        setTimeout(() => window.location.href = 'decks.html', 900);
        return;
      }

      let cards = [...deck.cards];
      let currentIndex = 0;
      let isFlipped = false;
      let busy = false;

      const flashcard = document.getElementById('flashcard');
      const container = document.getElementById('cardContainer');
      const front = document.querySelector('#cardFront .card-content');
      const back = document.querySelector('#cardBack .card-content');
      const frontImage = document.getElementById('frontImage');
      const backImage = document.getElementById('backImage');
      const progress = document.getElementById('progressCount');
      const progressBar = document.getElementById('progressBar');
      document.getElementById('deckTitle').textContent = deck.name;

      function renderImage(target, src) {
        target.innerHTML = '';
        if (!src) return;
        const img = document.createElement('img');
        img.src = src;
        img.alt = 'Imagem anexada ao flashcard';
        target.appendChild(img);
      }

      function renderCard() {
        const card = cards[currentIndex];
        front.textContent = card.front;
        back.textContent = card.back;
        renderImage(frontImage, card.image);
        renderImage(backImage, card.image);
        progress.textContent = `${currentIndex + 1} / ${cards.length}`;
        progressBar.style.width = `${((currentIndex + 1) / cards.length) * 100}%`;
      }

      function flipCard() {
        if (busy) return;
        isFlipped = !isFlipped;
        flashcard.classList.toggle('flipped', isFlipped);
      }

      function changeCard(direction) {
        if (busy) return;
        const nextIndex = currentIndex + direction;
        if (nextIndex < 0 || nextIndex >= cards.length) {
          Toast.show(direction > 0 ? 'Você chegou ao fim do baralho! 🎉' : 'Este é o primeiro card. 🌱');
          return;
        }

        busy = true;
        const exitClass = direction > 0 ? 'slide-out-left' : 'slide-out-right';
        const enterClass = direction > 0 ? 'slide-in-right' : 'slide-in-left';
        flashcard.classList.add(exitClass);

        setTimeout(() => {
          currentIndex = nextIndex;
          isFlipped = false;
          flashcard.classList.remove('flipped', exitClass);
          renderCard();
          flashcard.classList.add(enterClass);
          requestAnimationFrame(() => requestAnimationFrame(() => flashcard.classList.remove(enterClass)));
          setTimeout(() => { busy = false; }, 360);
        }, 180);
      }

      function shuffle() {
        for (let i = cards.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        currentIndex = 0;
        isFlipped = false;
        flashcard.classList.remove('flipped');
        renderCard();
        Toast.show('Baralho embaralhado! 🔀');
      }

      container.addEventListener('click', flipCard);
      document.getElementById('btnFlip').addEventListener('click', flipCard);
      document.getElementById('btnNext').addEventListener('click', () => changeCard(1));
      document.getElementById('btnPrev').addEventListener('click', () => changeCard(-1));
      document.getElementById('btnShuffle').addEventListener('click', shuffle);

      document.addEventListener('keydown', (event) => {
        if (event.target.matches('input, textarea, button, a')) return;
        if (event.code === 'Space') { event.preventDefault(); flipCard(); }
        if (event.key === 'ArrowRight') changeCard(1);
        if (event.key === 'ArrowLeft') changeCard(-1);
      });

      renderCard();
    });
  </script>
</body>
</html>
